apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-signed-image
    match:
      any:
            - resources:
          kinds:
                    - Pod
    verifyImages:
        - imageReferences:
            - "harbor.omnipay.local/omnipay/*"
      attestors:
            - entries:
                - keys:
            publicKeys: |-
              -----BEGIN PUBLIC KEY-----
              REPLACE_WITH_COSIGN_PUBLIC_KEY
              -----END PUBLIC KEY-----
